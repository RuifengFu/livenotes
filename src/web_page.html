<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · 课堂笔记</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root {
  --bg: #fbfaf7; --fg: #1f2328; --muted: #6a737d; --faint: #9aa1a9;
  --line: #e6e3dc; --card: #ffffff; --accent: #c2410c; --accent-soft: #fff1e8;
  --strong: #111; --code: #f3f1ec; --rec: #dc2626;
  --fs: 17px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --fg: #e6e6e3; --muted: #9ba1a6; --faint: #6b7177;
    --line: #2c2e31; --card: #1f2023; --accent: #fb923c; --accent-soft: #2a1f17;
    --strong: #fff; --code: #26282b; --rec: #f87171;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 64px; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: var(--fs)/1.75 -apple-system, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}
header {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
  padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); font-size: 14px;
}
header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { padding: 2px 10px; border-radius: 99px; background: var(--code); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.rec { color: var(--rec); }
.pill.rec::before { content: "●"; margin-right: 5px; animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .25; } }
#progress { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.tools { display: flex; gap: 4px; }
.tools button {
  border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 6px;
  padding: 2px 9px; font-size: 13px; cursor: pointer;
}
.tools button.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.wrap { display: grid; grid-template-columns: 220px minmax(0, 780px); gap: 40px; justify-content: center; padding: 24px 20px 180px; }
nav { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 220px); overflow: auto; font-size: 13px; line-height: 1.5; }
nav a { display: block; color: var(--muted); text-decoration: none; padding: 3px 0 3px 8px; border-left: 2px solid transparent; }
nav a.h1 { color: var(--fg); font-weight: 600; margin-top: 8px; }
nav a.h3 { padding-left: 20px; font-size: 12px; }
nav a:hover { color: var(--accent); border-left-color: var(--accent); }
@media (max-width: 1080px) { .wrap { grid-template-columns: minmax(0, 780px); } nav { display: none; } }
@media (max-width: 600px) { header { padding: 8px 16px; } .wrap { padding: 16px 16px 180px; } #progress { display: none; } }
main h1 { font-size: 1.5em; margin: 1.6em 0 .6em; line-height: 1.35; }
main h2 { font-size: 1.25em; margin: 1.5em 0 .5em; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
main h3 { font-size: 1.06em; margin: 1.3em 0 .4em; }
main strong { color: var(--strong); }
main p, main li { margin: .35em 0; }
main ul, main ol { padding-left: 1.4em; }
main hr { border: 0; height: 0; margin: 2.2em 0 .6em; }
main blockquote { margin: 0; color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
main blockquote p { margin: 0; }
main table { border-collapse: collapse; width: 100%; font-size: .92em; margin: .8em 0; display: block; overflow-x: auto; }
main th, main td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
main th { background: var(--code); }
main code { background: var(--code); padding: .1em .35em; border-radius: 4px; font-size: .88em; }
main pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto; line-height: 1.5; }
main pre code { background: none; padding: 0; }
.math-display { display: block; overflow-x: auto; margin: .6em 0; }
#empty { color: var(--muted); text-align: center; margin-top: 18vh; line-height: 2; }
.fresh { animation: fresh 2.4s ease-out; }
@keyframes fresh { from { background: var(--accent-soft); } to { background: transparent; } }
footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 20px 14px;
  background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5;
}
footer .inner { max-width: 1040px; margin: 0 auto; }
footer .zh { font-size: 15px; }
footer .en { color: var(--muted); font-size: 13px; }
footer .partial { color: var(--faint); font-style: italic; font-size: 13px; white-space: nowrap; overflow: hidden; }
footer.hidden { display: none; }
#follow {
  position: fixed; right: 24px; bottom: 120px; z-index: 6; display: none;
  border: 0; border-radius: 99px; padding: 8px 16px; background: var(--accent); color: #fff;
  font-size: 13px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.18);
}
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <span id="phase" class="pill"></span>
  <span id="progress"></span>
  <div class="tools">
    <button id="smaller" title="字小一点">A−</button>
    <button id="bigger" title="字大一点">A+</button>
    <button id="subs" title="显示 / 隐藏底部字幕">字幕</button>
  </div>
</header>
<div class="wrap">
  <nav id="toc"></nav>
  <main id="notes">{{BODY}}</main>
</div>
<button id="follow">↓ 有新笔记</button>
<footer id="foot"><div class="inner">
  <div class="zh" id="zh"></div><div class="en" id="en"></div><div class="partial" id="partial"></div>
</div></footer>
<script>
const LIVE = {{LIVE}};
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// 字号 / 字幕开关（只存在本机浏览器）
let fs = store.get("notes.fs", 17);
const applyFs = () => document.documentElement.style.setProperty("--fs", fs + "px");
applyFs();
$("smaller").onclick = () => { fs = Math.max(13, fs - 1); store.set("notes.fs", fs); applyFs(); };
$("bigger").onclick = () => { fs = Math.min(26, fs + 1); store.set("notes.fs", fs); applyFs(); };
let showSubs = LIVE && store.get("notes.subs", true);
const applySubs = () => { $("foot").classList.toggle("hidden", !showSubs); $("subs").classList.toggle("on", showSubs); };
applySubs();
$("subs").onclick = () => { showSubs = !showSubs; store.set("notes.subs", showSubs); applySubs(); };
if (!LIVE) { $("subs").style.display = "none"; }

function renderMath(root) {
  if (!window.katex) return;
  root.querySelectorAll(".math-inline, .math-display").forEach(el => {
    if (el.dataset.done) return;
    try {
      katex.render(el.textContent, el, { displayMode: el.classList.contains("math-display"), throwOnError: false });
      el.dataset.done = 1;
    } catch {}
  });
}

function buildToc() {
  const toc = $("toc");
  toc.innerHTML = "";
  $("notes").querySelectorAll("h1, h2, h3").forEach((h, i) => {
    h.id = "s" + i;
    const a = document.createElement("a");
    a.href = "#" + h.id; a.textContent = h.textContent; a.className = h.tagName.toLowerCase();
    toc.appendChild(a);
  });
}

const nearBottom = () => window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
$("follow").onclick = () => { window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); $("follow").style.display = "none"; };
window.addEventListener("scroll", () => { if (nearBottom()) $("follow").style.display = "none"; });

const clock = s => { s = Math.max(0, s | 0); const h = s / 3600 | 0, m = (s / 60 | 0) % 60, x = s % 60;
  return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(x).padStart(2, "0"); };

let version = null, phase = null, lastOk = Date.now();

function showNotes(html) {
  const main = $("notes"), follow = nearBottom(), oldLen = main.childElementCount;
  main.innerHTML = html || "";
  if (!html || !html.trim()) {
    main.innerHTML = '<div id="empty">还没有笔记。<br>听够一小段（约 3 分钟）后，AI 会开始整理，内容会自动出现在这里。</div>';
  }
  [...main.children].slice(Math.max(0, oldLen - 1)).forEach(el => el.classList.add("fresh"));
  renderMath(main);
  buildToc();
  if (follow) window.scrollTo({ top: document.body.scrollHeight });
  else if (main.childElementCount > oldLen) $("follow").style.display = "block";
}

function showStatus(s) {
  phase = s.phase;
  const p = $("phase");
  p.className = "pill" + (s.phase === "recording" ? " rec" : "");
  p.textContent = s.phase === "recording" ? "录音中 " + clock(s.elapsed)
    : s.phase === "finishing" ? "已停止录音，收尾中" : "处理中 " + clock(s.elapsed);
  const n = s.notes || {};
  let msg = "";
  if (n.summarizing) msg = "✎ 正在写课后总结…";
  else if (n.writing) msg = `✎ AI 正在整理第 ${n.writing} 部分…`;
  else if (n.chunk_words && n.pending_words >= n.chunk_words) msg = "等这句话说完就整理下一部分…";
  else if (n.chunk_words) msg = `下一部分笔记：已听到 ${n.pending_words} / ${n.chunk_words} 词`;
  if (n.done_parts) msg += ` · 已完成 ${n.done_parts} 部分`;
  $("progress").textContent = msg;
  const live = s.live || {}, last = (live.finals || []).slice(-1)[0];
  $("zh").textContent = last ? (last.speaker ? "【" + last.speaker + "】" : "") + last.zh : "";
  $("en").textContent = last ? last.en : "";
  $("partial").textContent = live.partial ? "… " + live.partial.slice(-160) : "";
}

async function poll() {
  try {
    const r = await fetch("/api/state" + (version === null ? "" : "?v=" + version), { cache: "no-store" });
    const s = await r.json();
    lastOk = Date.now();
    if (s.html !== undefined) { version = s.v; showNotes(s.html); }
    showStatus(s);
  } catch {
    if (Date.now() - lastOk > 4000) {
      $("phase").className = "pill";
      $("phase").textContent = "已结束";
      $("progress").textContent = "笔记已保存在会话文件夹（「笔记.html」可以直接打开）";
      $("foot").classList.add("hidden");
      return; // 程序已退出，不再轮询
    }
  }
  setTimeout(poll, 1500);
}

window.addEventListener("load", () => renderMath($("notes")));
if (LIVE) {
  poll();
} else {
  $("phase").textContent = "已结束";
  $("foot").classList.add("hidden");
  buildToc();
}
</script>
</body>
</html>
